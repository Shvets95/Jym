:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: one thumb-driven column; the working weight is the loudest thing on every card, as if stamped on a plate. */
:root{
  --bg:#e9edef;--card:#f8fafa;--fg:#14212b;--muted:#566672;--line:#cdd5da;--field:#fff;
  --accent:#1c58b5;--on-accent:#fff;--up:#14733f;--hold:#8a5a00;--down:#b3261e;--tint:#dfe7f3;
  --display:"Oswald","Arial Narrow",sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181d;--card:#1b242b;--fg:#e8eef1;--muted:#9aa9b4;--line:#31404a;--field:#10161a;
  --accent:#7fb0ff;--on-accent:#0b1a30;--up:#62cf94;--hold:#e6b450;--down:#ff8a80;--tint:#223349;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181d;--card:#1b242b;--fg:#e8eef1;--muted:#9aa9b4;--line:#31404a;--field:#10161a;
  --accent:#7fb0ff;--on-accent:#0b1a30;--up:#62cf94;--hold:#e6b450;--down:#ff8a80;--tint:#223349;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-block:12px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
h1,h2{font:600 22px/1.2 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:18px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;min-height:44px;padding:0 12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
button.small{min-height:36px;font-size:13px;padding:0 10px}
input,select{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 10px;min-width:0}
nav{position:fixed;inset:auto 0 0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}

.seg small{display:block;font-weight:400;font-size:11px;color:var(--muted);line-height:1.2}

.muted{color:var(--muted)}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.top{display:grid;gap:2px}
.name{font-weight:600}
.weight{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center}
.weight button{min-height:52px;line-height:1.1;padding:0}
.weight button b{display:block;font-size:20px}

.plate input{font:600 40px/1 var(--display);text-align:center;width:100%;max-width:130px;border:0;background:none;min-height:46px;padding:0;font-variant-numeric:tabular-nums}
.sets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sets input::placeholder{color:var(--muted);opacity:.55}
.sets input{width:58px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums;padding:0 4px}
.verdict{font-size:13px;font-weight:600;min-height:18px}
.up{color:var(--up)}.hold{color:var(--hold)}.down{color:var(--down)}
.check{display:flex;gap:8px;align-items:center;min-height:36px;font-size:13px}
.check input{width:20px;height:20px;min-height:0}
.simple{display:flex;justify-content:space-between;gap:12px;align-items:center}
.simple label{display:flex;gap:10px;align-items:center;min-height:36px}
.simple input{width:22px;height:22px;min-height:0;flex:none}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
.scroll{overflow-x:auto}
svg text{fill:var(--muted);font:11px var(--body)}
.finish{position:sticky;bottom:64px}
.add{display:grid;grid-template-columns:1fr auto;gap:8px}
ul,ol{margin:0;padding-left:20px;display:grid;gap:6px}
p{margin:0}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:528px;margin:auto;background:var(--fg);color:var(--bg);padding:10px 12px;border-radius:8px;z-index:6;font-size:14px}
</style>

<div class="wrap" id="app">
  <div class="card"><h1>Журнал зала</h1><p class="muted" id="boot">Загружаю вашу программу и историю. Здесь появятся тренировки А, Б и В с весами на сегодня.</p></div>
</div>
<nav id="nav" aria-label="Разделы"></nav>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Логика прогрессии: чистые функции ---------- */
function ladderUp(e,w){
  if(e.ladder&&e.ladder.length){const n=e.ladder.find(x=>x>w);if(n!==undefined)return n;
    const L=e.ladder;return w+(L[L.length-1]-L[L.length-2]);}
  return w+(e.step||5);
}
function ladderDown(e,w){
  if(e.ladder&&e.ladder.length){const c=e.ladder.filter(x=>x<w);return c.length?c[c.length-1]:w;}
  return Math.max(0,w-(e.step||5));
}
function decide(e,w,raw,pain,mode){
  const reps=raw.filter(x=>Number.isFinite(x));
  const base={w,sets:e.sets,lo:e.lo,hi:e.hi,fails:e.fails||0};
  const hold=(text)=>({...base,kind:'hold',text});
  if(pain)return hold('Была боль: вес не растёт. Следующий раз '+fmt(base));
  if(reps.length<e.sets)return hold('Сделано меньше подходов, чем в плане. Следующий раз '+fmt(base));
  const min=Math.min(...reps.slice(0,e.sets));
  if(min<e.lo*0.6){const n={...base,w:ladderDown(e,w),sets:3,fails:0};return{...n,kind:'down',text:'Сильно ниже плана. Следующий раз '+fmt(n)};}
  if(min<e.lo-2){const f=base.fails+1;
    if(f>=2){const n={...base,w:ladderDown(e,w),sets:3,fails:0};return{...n,kind:'down',text:'Второй срыв подряд. Следующий раз '+fmt(n)};}
    return{...hold('Ниже плана, пробуем ещё раз. Следующий раз '+fmt(base)),fails:f};}
  if(min<e.lo)return hold('Почти план. Следующий раз '+fmt(base));
  if(mode==='hold'){const n={...base,fails:0};return{...n,kind:'hold',text:'План выполнен. Режим «Держать»: '+fmt(n)};}
  if(e.repLadder){const i=e.repLadder.indexOf(e.lo);
    if(i>=0&&i<e.repLadder.length-1){const r=e.repLadder[i+1],n={...base,lo:r,hi:r,fails:0};return{...n,kind:'up',text:'План выполнен. Следующий раз '+fmt(n)};}
    const r=e.repLadder[0],n={...base,w:ladderUp(e,w),lo:r,hi:r,fails:0};return{...n,kind:'up',text:'План выполнен. Следующий раз '+fmt(n)};}
  if(e.sets<3){const n={...base,sets:e.sets+1,fails:0};return{...n,kind:'up',text:'План выполнен. Следующий раз '+fmt(n)};}
  const n={...base,w:ladderUp(e,w),sets:2,fails:0};return{...n,kind:'up',text:'План выполнен. Следующий раз '+fmt(n)};
}
function rng(x){return x.lo===x.hi?String(x.lo):x.lo+'–'+x.hi}
function fmt(x){return x.sets+'×'+num(x.w)+' кг на '+rng(x)}
function num(v){return String(Math.round(v*10)/10).replace('.',',')}
function breakSteps(days){return days>=14?2:days>=8?1:0}
function daysBetween(a,b){return Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/864e5)}
if(typeof window!=='undefined')window.__engine={decide,ladderUp,ladderDown,breakSteps};

/* ---------- Состояние ---------- */
let db=false,S=null,HIST=null,LOGS=[],BODY=[],tab='work',chartEx=null,loadTimer=null,stale=false,lastUndo=null;
const K_DRAFT='zal.draft',K_PEND='zal.pending',K_CACHE='zal.cache';
function ls(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r?JSON.parse(r):null}
  if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
let draft=ls(K_DRAFT)||{day:null,w:{},r:{},p:{},d:{}};
function saveDraft(){ls(K_DRAFT,draft)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shortDate(s){const[y,m,d]=s.split('-');return d+'.'+m+(y!==String(new Date().getFullYear())?'.'+y.slice(2):'')}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3500)}
function nextDayId(){const o=S.days.map(d=>d.id);const i=o.indexOf(S.lastDay);return o[(i+1)%o.length]}
function curDay(){return draft.day||nextDayId()}
function dayById(id){return S.days.find(d=>d.id===id)}

/* все данные живут в памяти этого браузера */
const K_DATA='zal.data',K_BACKUP='zal.backup';let storageBad=false;
function persist(){try{localStorage.setItem(K_DATA,JSON.stringify({S,L:LOGS,B:BODY,H:HIST}));storageBad=false}catch(e){storageBad=true}syncNote()}
function queue(){persist()}
function syncNote(){const el=document.getElementById('sync');if(el)el.hidden=!storageBad}
function saveState(){persist()}
/* ---------- Отрисовка ---------- */
function render(){renderNav();const a=document.getElementById('app');
  if(!S){a.innerHTML=`<div class="card"><h1>Журнал зала</h1><p class="muted">${db===false?'Журнал открывается, когда вы вошли в свой аккаунт Claude. Войдите и откройте страницу снова.':stale?'Пока не удаётся получить данные. Проверьте связь: страница продолжит попытки сама.':'Загружаю вашу программу и историю. Здесь появятся тренировки А, Б и В с весами на сегодня.'}</p></div>`;return}
  a.innerHTML={work:viewWork,progress:viewProgress,body:viewBody,rules:viewRules}[tab]();
  if(tab==='work')bindWork();if(tab==='progress')bindProgress();if(tab==='body')bindBody();if(tab==='rules')bindRules();syncNote();}
function renderNav(){const items=[['work','Тренировка'],['progress','Прогресс'],['body','Вес тела'],['rules','Правила']];
  const n=document.getElementById('nav');
  n.innerHTML=items.map(([k,t])=>`<button data-t="${k}" aria-current="${tab===k}">${t}</button>`).join('');
  n.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)})}

function viewWork(){
  const did=curDay(),day=dayById(did),nx=nextDayId();
  const gap=S.lastSession?daysBetween(S.lastSession,today()):0,steps=breakSteps(gap);
  const showBreak=steps&&S.breakAck!==S.lastSession;
  const mon=new Date().getDay()===1&&!BODY.some(b=>b.date===today());
  let h=`<div id="sync" class="note sm" hidden>Браузер не сохраняет записи. Откройте журнал в обычной вкладке Chrome или Safari, не в режиме инкогнито и не в предпросмотре файла.</div>`;
  h+=`<div class="seg">`+S.days.map(d=>`<button class="day" data-day="${d.id}" aria-pressed="${d.id===did}"><b>${esc(d.name)}</b><small>${d.id===nx?'следующая':(d.lastDate?shortDate(d.lastDate):'')}</small></button>`).join('')+`</div>`;
  if(showBreak)h+=`<div class="note"><b>Последняя запись: ${shortDate(S.lastSession)}, ${gap} дн. назад</b>
    <span class="sm">После таких пауз тренер снижал веса. Если вы всё это время занимались, оставьте как есть и поправьте веса вручную.</span>
    <div class="row"><button class="primary" id="brk-yes">Был перерыв: минус ${steps} ${steps===1?'ступень':'ступени'}</button><button id="brk-no">Занимался, оставить</button></div></div>`;
  const bk=ls(K_BACKUP);if(LOGS.length&&(!bk||daysBetween(bk,today())>=14))h+=`<div class="note sm"><span>${bk?'Последняя копия: '+shortDate(bk)+'.':'Копии записей ещё не было.'} Сохранить её можно в разделе «Правила».</span></div>`;
  if(mon)h+=`<div class="note sm"><span>Понедельник: запишите вес тела в разделе «Вес тела».</span></div>`;
  if(lastUndo)h+=`<div class="note"><b>Тренировка сохранена</b><div class="sm">${lastUndo.lines.map(esc).join('<br>')}</div><div class="row"><button id="undo">Отменить сохранение</button></div></div>`;
  h+=`<div class="seg" role="group" aria-label="Режим"><button id="m-g" aria-pressed="${S.mode!=='hold'}">Рост<small>вес растёт после плана</small></button><button id="m-h" aria-pressed="${S.mode==='hold'}">Держать<small>вес не растёт автоматически</small></button></div>`;
  h+=day.items.map(id=>card(id)).join('');
  h+=`<button class="primary finish" id="finish">Завершить тренировку</button>`;
  return h;
}
function card(id){
  const e=S.ex[id];
  if(e.kind==='simple'){const on=draft.d[id];return `<div class="card simple"><label for="d-${id}"><input type="checkbox" id="d-${id}" data-done="${id}" ${on?'checked':''}><span>${esc(e.name)}</span></label><span class="muted sm" style="white-space:nowrap">${esc(e.dose)}</span></div>`}
  const w=draft.w[id]??e.w,warm=(e.warm||[]).filter(x=>x[0]<w),reps=draft.r[id]||[],n=Math.max(e.sets,reps.length);
  const low=ladderDown(e,w),up=ladderUp(e,w);let ins='';
  for(let i=0;i<n;i++)ins+=`<input id="r-${id}-${i}" inputmode="numeric" pattern="[0-9]*" aria-label="Подход ${i+1}, повторы" placeholder="${rng(e)}" data-r="${id}" data-i="${i}" value="${reps[i]??''}">`;
  return `<div class="card">
    <div class="top"><span class="name">${esc(e.name)}</span>
      <span class="muted sm">${e.sets} ${e.sets===2?'подхода':e.sets>4?'подходов':e.sets===1?'подход':'подхода'} по ${rng(e)}${e.each?', '+esc(e.each):''}</span>
      ${warm.length?`<span class="muted sm">Разминка: ${warm.map(x=>num(x[0])+'×'+x[1]).join(' · ')}</span>`:''}
      ${e.note?`<span class="muted sm">${esc(e.note)}</span>`:''}</div>
    <div class="weight"><button data-minus="${id}" aria-label="Уменьшить до ${num(low)} кг"><b>−</b><span>${num(low)}</span></button>
      <div class="plate"><input id="w-${id}" inputmode="decimal" aria-label="Вес, кг" data-w="${id}" value="${num(w)}"><span class="muted sm">кг</span></div>
      <button data-plus="${id}" aria-label="Увеличить до ${num(up)} кг"><b>+</b><span>${num(up)}</span></button></div>
    <div class="sets">${ins}<button class="small" data-more="${id}">+ подход</button><button class="small" data-all="${id}">Всё по плану</button></div>
    <label class="check" for="p-${id}"><input type="checkbox" id="p-${id}" data-pain="${id}" ${draft.p[id]?'checked':''}>Была боль в спине или суставе</label>
    <div class="verdict" id="v-${id}"></div></div>`;
}
function parseReps(id){return(draft.r[id]||[]).map(x=>parseInt(x,10))}
function hasReps(id){return parseReps(id).some(Number.isFinite)}
function preview(id){const el=document.getElementById('v-'+id);if(!el)return;const e=S.ex[id];
  if(!hasReps(id)){el.textContent='';el.className='verdict';return}
  const r=decide(e,draft.w[id]??e.w,parseReps(id),draft.p[id],S.mode);el.textContent=r.text;el.className='verdict '+r.kind}
function bindWork(){
  const a=document.getElementById('app');
  a.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{draft.day=b.dataset.day;saveDraft();render()});
  const y=document.getElementById('brk-yes'),no=document.getElementById('brk-no');
  if(y)y.onclick=()=>{const st=breakSteps(daysBetween(S.lastSession,today()));
    Object.values(S.ex).forEach(e=>{if(e.kind==='simple')return;let w=e.w;for(let i=0;i<st;i++)w=ladderDown(e,w);e.w=w;e.sets=3;e.fails=0});
    S.breakAck=S.lastSession;saveState();render();toast('Веса снижены. Любой вес можно поправить кнопками − и +.')};
  if(no)no.onclick=()=>{S.breakAck=S.lastSession;saveState();render()};
  const u=document.getElementById('undo');if(u)u.onclick=undo;
  document.getElementById('m-g').onclick=()=>{S.mode='grow';saveState();render()};
  document.getElementById('m-h').onclick=()=>{S.mode='hold';saveState();render()};
  a.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const id=b.dataset.minus,e=S.ex[id];draft.w[id]=ladderDown(e,draft.w[id]??e.w);saveDraft();render()});
  a.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const id=b.dataset.plus,e=S.ex[id];draft.w[id]=ladderUp(e,draft.w[id]??e.w);saveDraft();render()});
  a.querySelectorAll('[data-w]').forEach(i=>i.onchange=()=>{const v=parseFloat(i.value.replace(',','.'));const id=i.dataset.w;
    if(Number.isFinite(v)&&v>=0){draft.w[id]=v;saveDraft();render()}else{i.value=num(draft.w[id]??S.ex[id].w);toast('Введите вес числом, например 52 или 12,5.')}});
  a.querySelectorAll('[data-r]').forEach(i=>i.oninput=()=>{const id=i.dataset.r;(draft.r[id]=draft.r[id]||[])[+i.dataset.i]=i.value;for(let k=0;k<draft.r[id].length;k++)if(draft.r[id][k]===undefined||draft.r[id][k]===null)draft.r[id][k]='';saveDraft();preview(id)});
  a.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{const id=b.dataset.more,e=S.ex[id];const r=draft.r[id]=draft.r[id]||[];while(r.length<e.sets)r.push('');r.push('');saveDraft();render()});
  a.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{const id=b.dataset.all,e=S.ex[id];draft.r[id]=Array(e.sets).fill(String(e.lo));saveDraft();render()});
  a.querySelectorAll('[data-pain]').forEach(i=>i.onchange=()=>{draft.p[i.dataset.pain]=i.checked;saveDraft();preview(i.dataset.pain)});
  a.querySelectorAll('[data-done]').forEach(i=>i.onchange=()=>{draft.d[i.dataset.done]=i.checked;saveDraft()});
  dayById(curDay()).items.forEach(id=>{if(S.ex[id].kind!=='simple')preview(id)});
  document.getElementById('finish').onclick=finish;
}
function finish(){
  const did=curDay(),day=dayById(did),date=today();
  const before=JSON.parse(JSON.stringify(S));const items=[],lines=[];
  day.items.forEach(id=>{const e=S.ex[id];if(e.kind==='simple')return;
    const w=draft.w[id]??e.w;
    if(hasReps(id)){const reps=parseReps(id).filter(Number.isFinite),r=decide(e,w,parseReps(id),draft.p[id],S.mode);
      items.push({id,name:e.name,w,sets:e.sets,lo:e.lo,hi:e.hi,reps,pain:!!draft.p[id],next:{w:r.w,sets:r.sets,lo:r.lo,hi:r.hi},kind:r.kind});
      lines.push(e.name+': '+fmt(r));Object.assign(e,{w:r.w,sets:r.sets,lo:r.lo,hi:r.hi,fails:r.fails})}
    else if(w!==e.w){e.w=w;lines.push(e.name+': вес изменён на '+num(w)+' кг')}});
  if(!items.length&&!lines.length){toast('Ничего не записано. Введите повторы хотя бы в одном упражнении.');return}
  const id=date+'-'+Date.now().toString(36);
  if(items.length){S.lastSession=date;S.lastDay=did;day.lastDate=date;
    const log={date,day:did,items,ts:Date.now()};LOGS=[...LOGS,{id,...log}];queue('log/'+id,log)}
  draft={day:null,w:{},r:{},p:{},d:{}};saveDraft();saveState();
  lastUndo={before,logId:items.length?id:null,lines};render();scrollTo(0,0);
}
function undo(){S=lastUndo.before;if(lastUndo.logId){LOGS=LOGS.filter(l=>l.id!==lastUndo.logId);queue('log/'+lastUndo.logId,null)}
  lastUndo=null;saveState();render();toast('Сохранение отменено.')}

/* ---------- Графики ---------- */
function lineChart(pts,opt){ /* pts:[{x:date,y,kind}] */
  if(pts.length<1)return '<p class="muted sm">Пока нет данных.</p>';
  const W=520,H=190,L=34,R=12,T=12,B=24;
  const xs=pts.map(p=>Date.parse(p.x)),x0=Math.min(...xs),x1=Math.max(...xs,x0+864e5);
  let y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));if(y0===y1){y0-=1;y1+=1}
  const pad=(y1-y0)*.1;y0-=pad;y1+=pad;
  const X=d=>L+(Date.parse(d)-x0)/(x1-x0)*(W-L-R),Y=v=>T+(y1-v)/(y1-y0)*(H-T-B);
  const step=(y1-y0)/4,ticks=[0,1,2,3,4].map(i=>y0+step*i);
  const grid=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${Y(t)+4}" text-anchor="end">${Math.round(t*(opt&&opt.dec?10:1))/(opt&&opt.dec?10:1)}</text>`).join('');
  const ms=[];let c=new Date(x0);c=new Date(c.getFullYear(),c.getMonth()+1,1);
  while(c.getTime()<=x1){ms.push(new Date(c));c=new Date(c.getFullYear(),c.getMonth()+1,1)}
  const every=ms.length>6?2:1;
  const labels=ms.filter((m,i)=>i%every===0).map(m=>{const s=m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-01';return `<text x="${X(s)}" y="${H-6}" text-anchor="middle">${String(m.getMonth()+1).padStart(2,'0')}.${String(m.getFullYear()).slice(2)}</text>`}).join('');
  const path=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const last=pts[pts.length-1];
